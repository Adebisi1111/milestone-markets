name: Contract Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install genlayer-test
        run: pip install genlayer-test
      - name: Run direct-mode tests
        run: gltest tests/direct/
